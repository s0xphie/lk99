[package]
name = "lkmod"
version = "0.1.0"
edition = "2021"
description = "Lost Kingdom BF game modding toolkit"

[[bin]]
name = "lkmod"
path = "src/main.rs"

[lib]
name = "lkmod"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
png = "0.17"
ratatui = "0.29"
crossterm = "0.28"
